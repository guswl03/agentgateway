name: Build EC2 binary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ec2-binary.yml
      - Cargo.lock
      - Cargo.toml
      - Makefile
      - crates/**
      - schema/**
      - ui/**

permissions:
  contents: write

concurrency:
  group: ec2-binary-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      GIT_REVISION: ${{ github.sha }}
      VERSION: ec2-main
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ui/.nvmrc

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: '1.98.0'
          targets: x86_64-unknown-linux-musl

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          corepack enable

      - name: Build UI and static Linux binary
        run: make build CARGO_BUILD_ARGS="--target x86_64-unknown-linux-musl"

      - name: Prepare release files
        run: |
          mkdir -p release
          install -m 0755 target/x86_64-unknown-linux-musl/release/agentgateway release/agentgateway-linux-amd64
          cd release
          sha256sum agentgateway-linux-amd64 > agentgateway-linux-amd64.sha256

      - name: Publish stable EC2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ec2-main >/dev/null 2>&1; then
            gh release create ec2-main --title "EC2 deployment build" --notes "Linux build of the customized main branch for EC2 deployment."
          fi
          gh release upload ec2-main release/agentgateway-linux-amd64 release/agentgateway-linux-amd64.sha256 --clobber
